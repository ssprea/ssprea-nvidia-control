
name: slimit-gui
arch: amd64
platform: linux

version: ${VERSION}
release: ${PKGREL}

maintainer: "ssprea <ssprea@proton.me>"
vendor: ssprea

homepage: https://github.com/ssprea/slimit

description: sLimit GPU control - Graphical Interface

section: utils
priority: optional

depends:
  - systemd

contents:
  - src: SLimit.Gui/bin/Release/net10.0/linux-x64/publish/SLimit.Gui
    dst: /usr/local/bin/slimit-gui
    type: tree
    
    
  - src: SLimit.Gui/Assets/SLimit.desktop
    dst: /usr/share/applications/SLimit.desktop
    type: tree
    
  
  - src: SLimit.Gui/SystemdServices/snvctl-gui.service
    dst: /usr/lib/systemd/user/snvctl-gui.service
