name: Package for Linux on release

on:
  release:
    types: [released]

  
  workflow_dispatch:

permissions:
  contents: write


  


jobs:
  package:
    name: Build Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      #for nfpm
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building sLimit version: $VERSION"

      - name: Run make deb
        run: make deb

      - name: Run make rpm
        run: make rpm
      
      - name: Generate checksums
        run: |
          cd ./packages
          sha256sum *.deb *.rpm > SHA256SUMS

      
      - name: Show packages
        run: |
          pwd
          ls -lh ./packages

      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: slimit-linux-packages
          path: ./packages
          if-no-files-found: error

    
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            "./packages/*.deb"
            "./packages/*.rpm"
            "./packages/SHA256SUMS"


      - name: Checkout APT repository
        uses: actions/checkout@v7
        with:
          repository: ssprea/snvctl-apt-repo
          ref: main
          token: ${{ secrets.APT_REPO_ACCESS_TOKEN }}
          path: apt-repo

      

            
      - name: quanto vale la tua auto
        run: pwd

      - name: Install tools for APT repo update
        run: |
          sudo apt-get install -y apt-utils dpkg-dev gnupg gzip

      - name: Import APT GPG key
        run: printf '%s\n' "$secrets.APT_REPO_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Copy deb packages to APT repo
        run: cp packages/*.deb apt-repo/ubuntu/

      - name: Update and sign APT repo
        run: |
          cd apt-repo
          chmod +x ./update.sh
          ./update.sh
          ls
          ls ubuntu

      - name: quanto vale la tua auto
        run: pwd
