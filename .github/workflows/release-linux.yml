name: Package for Linux on release

on:
  push:
    tags:
      - '*'

  
  workflow_dispatch:

permissions:
  contents: write

env:
  
  SLIMIT_GUI_PROJECT: SLimit.Gui/SLimit.Gui.csproj
  SLIMIT_DAEMON_PROJECT: SLimit.Daemon/SLimit.Daemon.csproj
  SLIMIT_CLI_PROJECT: SLimit.Cli/SLimit.Cli.csproj

  BUILD_CLI_PATH: build/cli
  BUILD_DAEMON_PATH: build/daemon
  BUILD_GUI_PATH: build/gui
  BUILD_PACKAGES: build/packages

  
  GUI_APPHOST: SLimit.Gui
  DAEMON_APPHOST: SLimit.Daemon
  CLI_APPHOST: SLimit.Cli

jobs:
  package:
    name: Build Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      #for nfpm
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.4'

      
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building sLimit version: $VERSION"

      
      - name: Prepare directories
        run: |
          mkdir -p "$BUILD_GUI_PATH"
          mkdir -p "$BUILD_DAEMON_PATH"
          mkdir -p "$BUILD_CLI_PATH"
          mkdir -p "$BUILD_PACKAGES"

      
      - name: Publish GUI
        run: |
          dotnet publish "$SLIMIT_GUI_PROJECT" \
            --configuration Release \
            -r linux-x64 \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true
            -p:UseAppHost=true \
            -p:Version="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output "$BUILD_GUI_PATH"

      
      - name: Publish daemon
        run: |
          dotnet publish "$SLIMIT_DAEMON_PROJECT" \
            --configuration Release \
            -r linux-x64 \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true
            -p:UseAppHost=true \
            -p:Version="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output "$BUILD_DAEMON_PATH"

      
      - name: Publish CLI
        run: |
          dotnet publish "$SLIMIT_CLI_PROJECT" \
            --configuration Release \
            -r linux-x64 \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:IncludeAllContentForSelfExtract=true
            -p:UseAppHost=true \
            -p:Version="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            --output "$BUILD_CLI_PATH"

      
      - name: Verify published binaries
        shell: bash
        run: |
          for binary in \
            "$BUILD_GUI_PATH/$GUI_APPHOST" \
            "$BUILD_DAEMON_PATH/$DAEMON_APPHOST" \
            "$BUILD_CLI_PATH/$CLI_APPHOST"
          do
            if [[ ! -x "$binary" ]]; then
              echo "ERROR: executable not found: $binary"
              exit 1
            fi
          done

      
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      
      - name: Package DEB
        run: |
          nfpm package \
            --config nfpm.yaml \
            --packager deb \
            --target "$BUILD_PACKAGES"

      - name: Package RPM
        run: |
          nfpm package \
            --config nfpm.yaml \
            --packager rpm \
            --target "$BUILD_PACKAGES"

      
      - name: Generate checksums
        run: |
          cd "$BUILD_PACKAGES"
          sha256sum *.deb *.rpm > SHA256SUMS

      
      - name: Show packages
        run: |
          ls -lh "$BUILD_PACKAGES"

      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slimit-linux-packages
          path: "$BUILD_PACKAGES"
          if-no-files-found: error

    
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            "$BUILD_PACKAGES/*.deb"
            "$BUILD_PACKAGES/*.rpm"
            "$BUILD_PACKAGES/SHA256SUMS"
