
name: slimit-daemon
arch: amd64
platform: linux

version: ${VERSION}
release: ${PKGREL}

maintainer: "ssprea <ssprea@proton.me>"
vendor: ssprea

homepage: https://github.com/ssprea/slimit

description: sLimit GPU control - Daemon

section: utils
priority: optional

contents:
  - src: SLimit.Daemon/bin/Release/net10.0/linux-x64/publish/SLimit.Daemon
    dst: /usr/local/bin/slimitd
    type: tree

  - src: SLimit.Daemon/SystemdServices/slimitd.service
    dst: /usr/lib/systemd/system/slimitd.service


overrides:
  rpm:
    scripts:
      postinstall: nfpm/post-install-daemon.sh
  deb:
    scripts:
      postinstall: nfpm/post-install-daemon.sh